- name: Prepare nodes for Kubernetes (kubeadm)
  hosts: k8s
  become: true
  vars:
    k8s_minor: "1.33"
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gpg]
        update_cache: true
        state: present

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: ansible_swaptotal_mb > 0

    - name: Comment any swap entries in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: "overlay\nbr_netfilter\n"
        mode: "0644"

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Sysctls for k8s networking
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables }
        - { key: net.bridge.bridge-nf-call-ip6tables }
        - { key: net.ipv4.ip_forward }

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present

    - name: Ensure /etc/containerd exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate containerd default config
      ansible.builtin.command: containerd config default
      register: containerd_default
      changed_when: false

    - name: Write containerd config with SystemdCgroup enabled
      ansible.builtin.copy:
        content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        dest: /etc/containerd/config.toml
        mode: "0644"
      notify: Restart containerd

    - name: Enable + start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Ensure apt keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes apt key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name: [kubelet, kubeadm, kubectl]
        update_cache: true
        state: present

    - name: Hold kube packages (no surprise upgrades)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
