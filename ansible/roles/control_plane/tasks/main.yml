---
# --- Preserve the cluster CA across rebuilds (opsbox = stable root of trust) ---
- name: Ensure the opsbox PKI store exists (0700)
  ansible.builtin.file:
    path: "{{ pki_store }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Is there a saved (encrypted) CA on the custodian?
  ansible.builtin.stat:
    path: "{{ pki_store }}/ca.key.enc"        # the ciphertext private keys are SOPS/age-encrypted at rest
  delegate_to: localhost
  become: false
  register: saved_ca

- name: Pre-create the pki dirs on the control plane (when restoring)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/kubernetes/pki
    - /etc/kubernetes/pki/etcd
  when: saved_ca.stat.exists

# Certs are publically copied plaintext as-is. Private keys are SOPS-encrypted 
# decrypted on the controller (operator age key), then placed 0600 on cp-1.
- name: Restore CA certs BEFORE init (plaintext, copied as-is)
  ansible.builtin.copy:
    src: "{{ pki_store }}/{{ item.f }}"
    dest: "/etc/kubernetes/pki/{{ item.f }}"
    owner: root
    group: root
    mode: "{{ item.m }}"
  loop:
    - { f: "ca.crt",             m: "0644" }
    - { f: "sa.pub",             m: "0644" }
    - { f: "front-proxy-ca.crt", m: "0644" }
    - { f: "etcd/ca.crt",        m: "0644" }
  when: saved_ca.stat.exists

- name: Decrypt the CA private keys on the controller (age key is operator-supplied, off-box)
  ansible.builtin.command:
    cmd: "sops --decrypt --input-type binary --output-type binary {{ pki_store }}/{{ item }}.enc"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true                                 # never echo key material
  environment:
    SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
  register: decrypted_ca
  loop: [ca.key, sa.key, front-proxy-ca.key, etcd/ca.key]
  when: saved_ca.stat.exists

- name: Place the decrypted keys on the control plane (0600, root)
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "/etc/kubernetes/pki/{{ item.item }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  loop: "{{ decrypted_ca.results | default([]) }}"   # default([]) so first-run (keys skipped) doesn't error
  loop_control:
    label: "{{ item.item }}"                   # log the filename, not the key
  when: saved_ca.stat.exists

- name: Already initialized?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ control_plane_ip }}
    --control-plane-endpoint={{ control_plane_ip }}
  args:
    creates: /etc/kubernetes/admin.conf
  when: not admin_conf.stat.exists

# Certs resync plaintext every run (cheap, idempotent). Private keys are captured + encrypted
# ONCE, on the first-ever bootstrap after that the store already holds the ciphertext.
- name: Save CA certs back to the custodian (plaintext; idempotent)
  ansible.builtin.fetch:
    src: "/etc/kubernetes/pki/{{ item }}"
    dest: "{{ pki_store }}/{{ item }}"
    flat: true
  loop: [ca.crt, sa.pub, front-proxy-ca.crt, etcd/ca.crt]

- name: Capture + encrypt the private keys first bootstrap only
  when: not saved_ca.stat.exists
  no_log: true
  block:
    - name: Read the fresh private keys from the control plane
      ansible.builtin.slurp:
        src: "/etc/kubernetes/pki/{{ item }}"
      register: fresh_keys
      loop: [ca.key, sa.key, front-proxy-ca.key, etcd/ca.key]

    - name: Ensure the etcd subdir exists in the store
      ansible.builtin.file:
        path: "{{ pki_store }}/etcd"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: SOPS-encrypt each key into the store (public recipient; plaintext never hits controller disk)
      ansible.builtin.shell:
        cmd: "sops --encrypt --input-type binary --output-type binary --age {{ sops_age_recipient }} /dev/stdin > {{ pki_store }}/{{ item.item }}.enc"
        stdin: "{{ item.content | b64decode }}"
      delegate_to: localhost
      become: false
      loop: "{{ fresh_keys.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: .kube dir for debian user
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    owner: debian
    group: debian
    mode: "0700"

- name: kubeconfig for debian user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/debian/.kube/config
    remote_src: true
    owner: debian
    group: debian
    mode: "0600"

- name: Fetch kubeconfig back to the opsbox (belt-and-suspenders; CA is now stable)
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Install Helm
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Cilium helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Install Cilium (idempotent via Helm)
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    chart_version: "{{ cilium_chart_version }}"
    values:
      ipam:
        mode: cluster-pool
    wait: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Generate a fresh join command (tokens expire ~24h)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false
