---
# --- Preserve the cluster CA across rebuilds (opsbox = stable root of trust) ---
- name: Ensure the opsbox PKI store exists (0700)
  ansible.builtin.file:
    path: "{{ pki_store }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Is there a saved (encrypted) CA on the custodian?
  ansible.builtin.stat:
    path: "{{ pki_store }}/ca.key.enc"        # the ciphertext private keys are SOPS/age-encrypted at rest
  delegate_to: localhost
  become: false
  register: saved_ca

# FAIL LOUD #1: refuse to silently mint a new CA. A missing store on anything but a
# first-ever bootstrap means something is wrong (wrong pki_store, root run, lost store).
- name: Refuse to mint a fresh CA unless explicitly allowed
  ansible.builtin.assert:
    that:
      - saved_ca.stat.exists or (allow_fresh_ca | default(false) | bool)
    fail_msg: >-
      No saved CA at {{ pki_store }}/ca.key.enc and allow_fresh_ca is false.
      Refusing to mint a NEW cluster CA (it would invalidate existing kubeconfigs and the
      first-boot save-back would overwrite the real store). First-ever bootstrap? re-run with
      -e allow_fresh_ca=true. Otherwise fix pki_store / run as its owner (NOT root).
    success_msg: >-
      {{ 'Saved CA found will preserve it.'
         if saved_ca.stat.exists else 'allow_fresh_ca=true minting a fresh CA on purpose.' }}
  run_once: true

# Snapshot the store CA fingerprint BEFORE init (and before the save-back can overwrite it),
# so FAIL LOUD #2 can prove the cluster actually adopted it.
- name: Snapshot the store CA fingerprint (pre-init)
  ansible.builtin.command: "openssl x509 -in {{ pki_store }}/ca.crt -noout -fingerprint -sha256"
  delegate_to: localhost
  become: false
  changed_when: false
  register: store_ca_fp
  when: saved_ca.stat.exists

- name: Pre-create the pki dirs on the control plane (when restoring)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/kubernetes/pki
    - /etc/kubernetes/pki/etcd
  when: saved_ca.stat.exists

# Certs are public copied plaintext as-is. Private keys are SOPS-encrypted 
# decrypted on the controller (operator age key), then placed 0600 on cp-1.
- name: Restore CA certs BEFORE init (plaintext, copied as-is)
  ansible.builtin.copy:
    src: "{{ pki_store }}/{{ item.f }}"
    dest: "/etc/kubernetes/pki/{{ item.f }}"
    owner: root
    group: root
    mode: "{{ item.m }}"
  loop:
    - { f: "ca.crt",             m: "0644" }
    - { f: "sa.pub",             m: "0644" }
    - { f: "front-proxy-ca.crt", m: "0644" }
    - { f: "etcd/ca.crt",        m: "0644" }
  when: saved_ca.stat.exists

- name: Decrypt the CA private keys on the controller (age key is operator-supplied, off-box)
  ansible.builtin.command:
    cmd: "sops --decrypt --input-type binary --output-type binary {{ pki_store }}/{{ item }}.enc"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true                                 # never echo key material
  environment:
    SOPS_AGE_KEY: "{{ lookup('env', 'SOPS_AGE_KEY') }}"

  register: decrypted_ca
  loop: [ca.key, sa.key, front-proxy-ca.key, etcd/ca.key]
  when: saved_ca.stat.exists

- name: Place the decrypted keys on the control plane (0600, root)
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "/etc/kubernetes/pki/{{ item.item }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  loop: "{{ decrypted_ca.results | default([]) }}"   # default([]) so first-run (keys skipped) doesn't error
  loop_control:
    label: "{{ item.item }}"                   # log the filename, not the key
  when: saved_ca.stat.exists

- name: Already initialized?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ control_plane_ip }}
    --control-plane-endpoint={{ control_plane_ip }}
  args:
    creates: /etc/kubernetes/admin.conf
  when: not admin_conf.stat.exists

# FAIL LOUD #2: when we meant to preserve, the CA the cluster ACTUALLY adopted must equal the
# store CA. This runs BEFORE the save-back, so a silent failure can't overwrite the real store.
# (NB: compare the CA cert, not the apiserver leaf the leaf is regenerated every init.)
- name: Read the live cluster CA fingerprint (post-init)
  ansible.builtin.command: "openssl x509 -in /etc/kubernetes/pki/ca.crt -noout -fingerprint -sha256"
  changed_when: false
  register: live_ca_fp
  when: saved_ca.stat.exists

- name: Fail loudly if the cluster did NOT adopt the preserved CA
  ansible.builtin.assert:
    that:
      - live_ca_fp.stdout == store_ca_fp.stdout
    fail_msg: >-
      CA PRESERVATION FAILED. Store CA ({{ store_ca_fp.stdout }}) != cluster CA
      ({{ live_ca_fp.stdout }}). kubeadm minted a different CA despite a saved store restore
      skipped, wrong pki_store, or decrypt produced empty keys. Stopping BEFORE the save-back
      so your real store is not overwritten. Investigate before re-running.
    success_msg: "CA preserved: cluster CA == store CA ({{ live_ca_fp.stdout }})."
  when: saved_ca.stat.exists

# Certs resync plaintext every run (cheap, idempotent). Private keys are captured + encrypted
# ONCE, on the first-ever bootstrap after that the store already holds the ciphertext.
- name: Save CA certs back to the custodian (plaintext; idempotent)
  ansible.builtin.fetch:
    src: "/etc/kubernetes/pki/{{ item }}"
    dest: "{{ pki_store }}/{{ item }}"
    flat: true
  loop: [ca.crt, sa.pub, front-proxy-ca.crt, etcd/ca.crt]

- name: Capture + encrypt the private keys first bootstrap only
  when: not saved_ca.stat.exists
  no_log: true
  block:
    - name: Read the fresh private keys from the control plane
      ansible.builtin.slurp:
        src: "/etc/kubernetes/pki/{{ item }}"
      register: fresh_keys
      loop: [ca.key, sa.key, front-proxy-ca.key, etcd/ca.key]

    - name: Ensure the etcd subdir exists in the store
      ansible.builtin.file:
        path: "{{ pki_store }}/etcd"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: SOPS-encrypt each key into the store (public recipient; plaintext never hits controller disk)
      ansible.builtin.shell:
        cmd: "sops --encrypt --input-type binary --output-type binary --age {{ sops_age_recipient }} /dev/stdin > {{ pki_store }}/{{ item.item }}.enc"
        stdin: "{{ item.content | b64decode }}"
      delegate_to: localhost
      become: false
      loop: "{{ fresh_keys.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: .kube dir for debian user
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    owner: debian
    group: debian
    mode: "0700"

- name: kubeconfig for debian user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/debian/.kube/config
    remote_src: true
    owner: debian
    group: debian
    mode: "0600"

- name: Fetch kubeconfig back to the opsbox (belt-and-suspenders; CA is now stable)
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Install Helm
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Cilium helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Install Cilium (idempotent via Helm)
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    chart_version: "{{ cilium_chart_version }}"
    values:
      ipam:
        mode: cluster-pool
    wait: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Generate a fresh join command (tokens expire ~24h)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false
