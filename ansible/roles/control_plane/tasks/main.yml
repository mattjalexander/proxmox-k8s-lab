---
# --- Preserve the cluster CA across rebuilds (opsbox = stable root of trust) ---
- name: Ensure the opsbox PKI store exists (0700)
  ansible.builtin.file:
    path: "{{ pki_store }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Is there a saved CA on the opsbox?
  ansible.builtin.stat:
    path: "{{ pki_store }}/ca.key"
  delegate_to: localhost
  become: false
  register: saved_ca

- name: Pre-create the pki dirs on the control plane (when restoring)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/kubernetes/pki
    - /etc/kubernetes/pki/etcd
  when: saved_ca.stat.exists

- name: Restore saved CA material BEFORE init (kubeadm then reuses it)
  ansible.builtin.copy:
    src: "{{ pki_store }}/{{ item.f }}"
    dest: "/etc/kubernetes/pki/{{ item.f }}"
    owner: root
    group: root
    mode: "{{ item.m }}"
  loop:
    - { f: "ca.crt",             m: "0644" }
    - { f: "ca.key",             m: "0600" }
    - { f: "sa.pub",             m: "0644" }
    - { f: "sa.key",             m: "0600" }
    - { f: "front-proxy-ca.crt", m: "0644" }
    - { f: "front-proxy-ca.key", m: "0600" }
    - { f: "etcd/ca.crt",        m: "0644" }
    - { f: "etcd/ca.key",        m: "0600" }
  when: saved_ca.stat.exists

- name: Already initialized?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ control_plane_ip }}
    --control-plane-endpoint={{ control_plane_ip }}
  args:
    creates: /etc/kubernetes/admin.conf
  when: not admin_conf.stat.exists

- name: Save the cluster CA back to the opsbox (captures first bootstrap; resync after)
  ansible.builtin.fetch:
    src: "/etc/kubernetes/pki/{{ item }}"
    dest: "{{ pki_store }}/{{ item }}"
    flat: true
  loop:
    - ca.crt
    - ca.key
    - sa.pub
    - sa.key
    - front-proxy-ca.crt
    - front-proxy-ca.key
    - etcd/ca.crt
    - etcd/ca.key

- name: .kube dir for debian user
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    owner: debian
    group: debian
    mode: "0700"

- name: kubeconfig for debian user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/debian/.kube/config
    remote_src: true
    owner: debian
    group: debian
    mode: "0600"

- name: Fetch kubeconfig back to the opsbox (belt-and-suspenders; CA is now stable)
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Install Helm
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Cilium helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Install Cilium (idempotent via Helm)
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    chart_version: "{{ cilium_chart_version }}"
    values:
      ipam:
        mode: cluster-pool
    wait: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Generate a fresh join command (tokens expire ~24h)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false
